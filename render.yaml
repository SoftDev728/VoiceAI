services:
  - type: web
    name: voiceai-backend
    env: docker  # Change this from 'python' to 'docker'
    region: oregon
    branch: main
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT  # This is optional; Dockerfile CMD will also work
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: CREDENTIALS_FILE
        sync: false
      - key: HOSPITAL_NAME
        sync: false
      - key: HOSPITAL_ADDRESS
        sync: false
      - key: HOSPITAL_PHONE
        sync: false
      - key: OPD_HOURS
        sync: false
      - key: LLM_MODEL_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TTS_MODEL
        sync: false
      - key: TTS_VOICE
        sync: false
      - key: STT_MODEL
        sync: false
